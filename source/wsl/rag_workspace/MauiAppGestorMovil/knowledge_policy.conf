# =============================================================
#
# Proyecto:
# Arquitectura RAG local con supervisión térmica
#
# Archivo:
# knowledge_policy.conf
#
# Versión:
# 1.2
#
# Fecha:
# 21 de Agosto de 2026
#
# Descripción:
# ------------
# Política de adquisición de conocimiento utilizada para
# construir la vista autorizada del proyecto dentro del
# workspace RAG.
#
# Define qué elementos del proyecto original pueden formar
# parte del conocimiento adquirido.
#
# Estrategia:
#
# LISTA BLANCA
#
# Solo los elementos definidos explícitamente serán copiados
# hacia:
#
#     source/
#
# Los elementos no autorizados quedan fuera del proceso de
# adquisición de conocimiento.
#
# Esta política pertenece exclusivamente al proyecto actual.
#
# Cada proyecto dentro del workspace puede definir sus propias
# reglas de adquisición.
#
# Cambios versión 1.2:
# --------------------
# - Exclusión de carpetas de respaldo duplicadas dentro de
#   DatosIniciales (respaldo original, respaldo2..respaldo6),
#   que generaban ruido de contenido casi idéntico en el índice
#   semántico.
# - Exclusión de carpetas 'Deprecated' (Repositories, Services)
#   para evitar que código en desuso sea presentado al LLM como
#   si fuera parte de la arquitectura vigente.
#
# =============================================================


# =============================================================
# Directorios autorizados
#
# Solo estos directorios serán considerados conocimiento.
# =============================================================

include_dirs =
Views,
ViewModels,
Models,
Services,
Repositories,
Helpers,
Controls,
Converters,
Resources,
Platforms,
Messages,
DatosIniciales,
docs



# =============================================================
# Extensiones autorizadas
#
# Solo estos tipos de archivos serán copiados.
# =============================================================

include_extensions =
.cs,
.xaml,
.md,
.json



# =============================================================
# Archivos específicos autorizados
#
# Archivos ubicados en la raíz del proyecto.
# =============================================================

include_files =
README.md,
ARQUITECTURA_DETALLADA.md,
CHANGELOG.md,
INSTRUCCIONES_RECONSTRUCCION.md



# =============================================================
# Exclusiones obligatorias
#
# Protección adicional aunque aparezcan dentro de rutas
# autorizadas.
# =============================================================

exclude_dirs = 
.git,
.vs,
bin,
obj,
respaldo original,
respaldo2,
respaldo3,
respaldo4,
respaldo5,
respaldo6,
Deprecated


# =============================================================
# Exclusiones por extensión
# =============================================================

exclude_extensions =
.user,
.tmp,
.log
