# =============================================================
#
# Proyecto:
# Arquitectura RAG local con supervisión térmica
#
# Archivo:
# project.conf
#
# Versión:
# 1.2
#
# Fecha:
# 10 de Agosto de 2026
#
# Descripción:
# ------------
# Archivo de identificación y configuración general de un
# proyecto dentro del workspace de conocimiento RAG.
#
# Define:
#
# - identidad del proyecto;
# - tecnología y lenguaje actual;
# - ubicación de la fuente primaria;
# - ubicación del workspace;
# - directorios internos de conocimiento.
#
# Este archivo NO define reglas de filtrado.
#
# Las políticas de adquisición de conocimiento pertenecen a:
#
#     knowledge_policy.conf
#
# y son aplicadas por:
#
#     knowledge_filter.py
#
# Cambios versión 1.2:
# --------------------
# - Incorporación explícita del parámetro 'language' para soporte
#   multilenguaje en extractores de símbolos y parsers AST.
# - Declaración del directorio objetivo para símbolos (symbols_path).
#
# =============================================================
#
# Arquitectura conceptual del Workspace de Conocimiento
#
# El workspace separa:
#
# - proyecto original;
# - código fuente autorizado;
# - conocimiento generado;
# - proveedores de conocimiento futuros.
#
#
# rag_workspace
#
# └── MauiAppGestorMovil
#
#     ├── project.conf
#     │       Identidad y configuración general
#     │
#     ├── knowledge_policy.conf
#     │       Política de adquisición del conocimiento
#     │
#     ├── source/
#     │       Código fuente seleccionado mediante filtrado
#     │
#     └── knowledge/
#             Fuentes de conocimiento generadas
#
#             ├── embeddings/
#             │       Recuperación semántica mediante vectores
#             │
#             ├── symbols/
#             │       Estructura del código (KS 2: Símbolos)
#             │
#             ├── dependencies/
#             │       Relaciones entre componentes (futuro)
#             │
#             ├── metadata/
#             │       Información auxiliar del conocimiento
#             │
#             └── futuras fuentes de conocimiento
#
#
# Flujo conceptual:
#
# Proyecto original
#        |
#        | source_path
#        ▼
# knowledge_filter.py
#        |
#        | source_path_local
#        ▼
# source/
#        |
#        ▼
# Extractores / Parsers (según 'language')
#        |
#        ▼
# knowledge/
#        |
#        ▼
# Knowledge Sources (embeddings, symbols, etc.)
#        |
#        ▼
# Context Providers
#        |
#        ▼
# Inferencia LLM
#
#
# Principios arquitectónicos:
#
# - Separar proyecto original de conocimiento generado.
# - No modificar la fuente primaria.
# - Mantener independencia entre adquisición e inferencia.
# - Permitir evolución incremental de nuevas fuentes de conocimiento.
# - Mantener el workspace independiente de la tecnología actual.
#
# =============================================================


# =============================================================
# Identificación del proyecto
# =============================================================

project_name = MauiAppGestorMovil

project_version = 1.0


# =============================================================
# Tecnología y Lenguaje actual
#
# Describe el estado actual de implementación.
# Utilizado por los extractores/parsers para seleccionar la
# estrategia adecuada de análisis sintáctico (AST/Symbols).
#
# No representa la identidad permanente del proyecto.
# =============================================================

language = csharp

technology = .NET MAUI

database = SQLite


# =============================================================
# Origen del conocimiento
#
# Fuente primaria del proyecto.
#
# No debe modificarse durante el proceso RAG.
# =============================================================

source_type = windows_project

source_path = E:\Developer\CSharp\Proyectos\Prog2\ProyFinal\src\MauiAppGestorMovil_SQLite


# =============================================================
# Workspace de conocimiento
# =============================================================

workspace_type = rag_project_workspace

workspace_path = /home/manuelc/rag_workspace/MauiAppGestorMovil


# =============================================================
# Directorios internos del workspace
#
# source:
# Copia filtrada del proyecto original.
#
# knowledge:
# Productos generados por los Knowledge Sources.
#
# Ejemplo:
#
# knowledge/
# ├── embeddings/
# ├── symbols/
# ├── metadata/
# └── dependencies/
#
# =============================================================

source_path_local = source

knowledge_path = knowledge

embeddings_path = knowledge/embeddings

symbols_path = knowledge/symbols
