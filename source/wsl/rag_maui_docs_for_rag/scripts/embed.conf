# =============================================================
#
# Proyecto:
# Arquitectura RAG local con supervisión térmica
#
# Archivo:
# embed.conf
#
# Versión:
# 1.1
#
# Fecha:
# 12 de Agosto de 2026
#
# Descripción:
# ------------
# Configuración específica del generador de embeddings.
#
# Este archivo define únicamente los parámetros relacionados
# con la generación de vectores mediante el backend de
# embeddings.
#
# Las reglas de adquisición del conocimiento NO pertenecen
# a este archivo.
#
# Dichas reglas son responsabilidad de:
#
# knowledge_policy.conf
#
# y son aplicadas por:
#
# knowledge_filter.py
#
# =============================================================


# =============================================================
# Modelo de embeddings
# =============================================================

model = nomic-embed-text


# =============================================================
# Backend de embeddings
# =============================================================

ollama_url = http://localhost:11434/api/embeddings


# =============================================================
# Control de carga de CPU
#
# Estos parámetros permiten espaciar las solicitudes al backend
# local para reducir la carga sostenida del procesador.
#
# La supervisión térmica general continúa siendo responsabilidad
# del sistema de protección térmica.
# =============================================================

cpu_load = 40

max_sleep = 1.5

